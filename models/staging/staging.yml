version: 2

sources:
  - name: synthetic_raw
    description: >
      Synthetic raw extracts used to model production source systems for the
      merchant settlement reconciliation take-home. In production these would
      be connector-managed raw tables such as payments_db.settlement_events,
      netsuite.journal_entries, and crm.merchants.
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    meta:
      contains_synthetic_data_only: true
      production_pattern: "Replace seed-backed raw extracts with dbt sources that enforce contracts and freshness checks."
    tables:
      - name: settlement_events
        identifier: settlement_events
        description: >
          Raw settlement event extract representing payments_db.settlement_events.
          Contains merchant settlement lifecycle events used to build the canonical
          settlement subledger fact.
        loaded_at_field: source_updated_at
        freshness:
          warn_after:
            count: 90
            period: day
        columns:
          - name: event_id
            description: Stable source identifier for the settlement event.
            tests:
              - not_null
              - unique
          - name: settlement_id
            description: Source settlement identifier grouping related events.
            tests:
              - not_null
          - name: merchant_id
            description: Source merchant identifier used to resolve legal entity.
            tests:
              - not_null
          - name: event_type
            description: Settlement lifecycle event type.
            tests:
              - not_null
              - accepted_values:
                  values: ['SETTLED', 'REVERSED', 'ADJUSTED', 'CHARGEBACK']
          - name: status
            description: Settlement event processing status. Only FINAL events enter certified reconciliation outputs.
            tests:
              - not_null
              - accepted_values:
                  values: ['PENDING', 'FINAL']
          - name: currency
            description: ISO currency for the settlement event.
            tests:
              - not_null
          - name: source_updated_at
            description: Timestamp when the source event was last updated; used for CDC deduplication and late-arriving data handling.
            tests:
              - not_null

      - name: journal_entries
        identifier: journal_entries
        description: >
          Raw journal entry extract representing netsuite.journal_entries. The
          Merchant Payable reconciliation filters this source to account 2100
          in the intermediate layer.
        loaded_at_field: created_at
        freshness:
          warn_after:
            count: 90
            period: day
        columns:
          - name: je_id
            description: Stable source identifier for the journal entry line.
            tests:
              - not_null
              - unique
          - name: posting_date
            description: GL accounting date used for the reconciliation tie-out grain.
            tests:
              - not_null
          - name: account
            description: NetSuite GL account. Merchant Payable is account 2100.
            tests:
              - not_null
          - name: entity
            description: NetSuite legal entity.
            tests:
              - not_null
          - name: currency
            description: GL entry currency.
            tests:
              - not_null
          - name: created_at
            description: Timestamp when the journal entry was created in the source system.
            tests:
              - not_null

      - name: merchants
        identifier: merchants
        description: >
          Raw merchant reference extract representing crm.merchants. Used to map
          settlement events to legal entity and country.
        loaded_at_field: updated_at
        freshness:
          warn_after:
            count: 90
            period: day
        columns:
          - name: merchant_id
            description: Stable source merchant identifier.
            tests:
              - not_null
              - unique
          - name: merchant_name
            description: Merchant display name.
          - name: legal_entity
            description: Legal entity that owns the merchant settlement activity.
            tests:
              - not_null
          - name: country
            description: Merchant country.
            tests:
              - not_null
          - name: updated_at
            description: Timestamp when the merchant reference record was last updated.
            tests:
              - not_null

models:
  - name: stg_payments__settlement_events
    description: >
      Staging model for settlement events. Standardizes data types, normalizes
      casing, preserves source lineage, and deduplicates CDC-style source records
      by event_id using the latest source_updated_at.
    columns:
      - name: event_id
        description: Stable source identifier for the settlement event.
        tests:
          - not_null
          - unique
      - name: settlement_id
        description: Source settlement identifier grouping related settlement lifecycle events.
        tests:
          - not_null
      - name: merchant_id
        description: Source merchant identifier used to join settlement events to merchant reference data.
        tests:
          - not_null
      - name: event_type
        description: Standardized settlement event type used for downstream sign logic.
        tests:
          - not_null
          - accepted_values:
              values: ['SETTLED', 'REVERSED', 'ADJUSTED', 'CHARGEBACK']
      - name: event_ts
        description: Source event timestamp.
        tests:
          - not_null
      - name: event_date
        description: Date derived from event_ts for simple sample-project accounting date handling.
        tests:
          - not_null
      - name: gross_amount
        description: Gross settlement amount before fees.
        tests:
          - not_null
      - name: fee_amount
        description: Fee amount deducted from gross settlement amount.
        tests:
          - not_null
      - name: net_amount
        description: Net settlement amount before applying accounting sign logic.
        tests:
          - not_null
      - name: currency
        description: Standardized settlement currency.
        tests:
          - not_null
      - name: status
        description: Standardized settlement status. Only FINAL records flow into certified subledger outputs.
        tests:
          - not_null
          - accepted_values:
              values: ['PENDING', 'FINAL']
      - name: source_updated_at
        description: Source update timestamp used for CDC-style deduplication and late-arriving record handling.
        tests:
          - not_null
      - name: dbt_loaded_at
        description: Deterministic source watermark timestamp for the staged event. Uses source_updated_at so reruns over unchanged source data are idempotent.
      - name: dbt_invocation_id
        description: Deterministic source-row fingerprint retained in the legacy invocation lineage field so unchanged source rows remain stable across reruns.
      - name: source_relation
        description: Human-readable source relation represented by this synthetic seed-backed staging model.
        tests:
          - not_null
